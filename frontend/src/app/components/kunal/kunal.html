<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kunal Shinde</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 70px;
            color: white;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow:
                0 0 10px #38bdf8,
                0 0 30px #38bdf8,
                0 0 60px #38bdf8;
            transition: 0.3s ease;
        }

        h1:hover {
            transform: scale(1.08);
            text-shadow:
                0 0 15px #22d3ee,
                0 0 40px #22d3ee,
                0 0 80px #22d3ee;
        }
    </style>
</head>

<body>
    <h1>Kunal Shinde</h1>
</body>
</html>
